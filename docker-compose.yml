services:
  postgres:
    image: postgres:16-alpine
    container_name: nazariitsubera-postgres
    environment:
      POSTGRES_DB: nazariitsubera
      POSTGRES_USER: nazariitsubera
      POSTGRES_PASSWORD: nazariitsubera
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazariitsubera -d nazariitsubera"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: nazariitsubera-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
